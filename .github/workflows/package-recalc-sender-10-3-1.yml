name: Package ReCalc Sender 10.3.1

on:
  push:
    branches:
      - recalc-sender-10-3-1-artifact
    paths-ignore:
      - 'release/ReCalc-Sender-10.3.1.zip'
      - 'release/ReCalc-Sender-10.3.1-validation.txt'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run image-engine tests
        run: |
          node --test \
            apps/chrome-extension/recalc-sidepanel/tests/runCampaign.test.js \
            apps/chrome-extension/recalc-sidepanel/tests/waAttachments.test.js \
            apps/chrome-extension/recalc-sidepanel/tests/waSelectors.test.js \
            apps/chrome-extension/recalc-sidepanel/tests/contentWhatsappAttachMedia.test.js

      - name: Build Chrome Web Store ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=apps/chrome-extension/recalc-sidepanel
          OUT=/tmp/ReCalc-Sender-10.3.1
          rm -rf "$OUT"
          mkdir -p "$OUT" release
          cp -a "$SRC"/. "$OUT"/
          rm -rf "$OUT/tests" "$OUT/node_modules" "$OUT/.git" "$OUT/coverage"
          find "$OUT" -type f \( -name '*.map' -o -name '.env*' -o -name '*.pem' -o -name '*.key' \) -delete
          (
            cd "$OUT"
            zip -q -r -9 "$GITHUB_WORKSPACE/release/ReCalc-Sender-10.3.1.zip" .
          )
          unzip -t release/ReCalc-Sender-10.3.1.zip
          sha256sum release/ReCalc-Sender-10.3.1.zip | tee release/ReCalc-Sender-10.3.1.sha256

      - name: Commit packaged artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/ReCalc-Sender-10.3.1.zip release/ReCalc-Sender-10.3.1.sha256
          git diff --cached --quiet && exit 0
          git commit -m "Package ReCalc Sender 10.3.1 [skip ci]"
          git push
